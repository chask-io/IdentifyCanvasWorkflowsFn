function:
  name: IdentifyCanvasWorkflowsFn
  runtime: python3.12
  handler: handler.lambda_handler
  description: |
    Analiza los nodos de un canvas para identificar flujos de trabajo independientes y crea una seleccion nombrada para cada flujo. Usala cuando un canvas represente mas de un proceso de negocio (por ejemplo envio + registro, cobranza + pago) y necesites separarlos para materializarlos como pipelines distintos. Si el canvas es un unico flujo coherente, la funcion no crea selecciones adicionales.
  timeout: 120
  memory_size: 512

  layers:
    - foundationMinimal
    - foundationApi

  parameters:
    required:
      - name: node_id
        type: string
        description: "Node ID for widget configuration injection (standard Chask param)"
      - name: canvas_uuid
        type: string
        description: "UUID del canvas a analizar"
      - name: workflows
        type: array
        description: >
          Array de flujos de trabajo propuestos por el agente, cada uno con
          nombre, descripcion y lista de UUIDs de nodos.
          Ejemplo:
          [{"name":"Envio de cobranza","description":"Flujo para enviar mensajes de cobro",
          "node_ids":["uuid-1","uuid-2","uuid-3"]},
          {"name":"Registro de pago","description":"Procesa respuestas y registra pagos",
          "node_ids":["uuid-3","uuid-4","uuid-5"]}]

    optional:
      - name: create_selections
        type: boolean
        description: "Si es false, retorna los flujos validados sin crear selecciones (modo preview). Por defecto true."
        default: true

  widget:
    enabled: false
    type: dynamic_widget
    params: []

  testing:
    handles_files: false
    produces_files: false
