function:
  name: IdentifyCanvasWorkflowsFn
  runtime: python3.12
  handler: handler.lambda_handler
  description: |
    Crea selecciones nombradas sobre un canvas a partir de agrupaciones explícitas provistas por el llamador. Soporta canvases legacy y flowchart v2. En v2 valida lanes, nodes, edges, data, credentials y flow.order; además incluye automáticamente data/credentials vinculadas a los lanes/nodes seleccionados. Si algún ID no existe en el canvas, rechaza la llamada completa con un mensaje explicativo.
  timeout: 120
  memory_size: 512

  layers:
    - foundationMinimal
    - foundationApi

  parameters:
    required:
      - name: node_id
        type: string
        description: "Node ID for widget configuration injection (standard Chask param)"
      - name: canvas_uuid
        type: string
        description: "UUID del canvas a analizar"
      - name: selections
        type: object
        description: >
          Objeto (dict) donde cada clave es el NOMBRE de la selección a crear.
          Para canvas v2, preferir element_ids con lanes, nodes, edges, data,
          credentials y flow. Para legacy se aceptan node_ids y edge_ids.
          Ejemplo:
          {
            "Envio de cobranza": {
              "description": "Envia mensajes de cobro a clientes con pendientes",
              "element_ids": {
                "lanes": ["lane_agent","lane_whatsapp"],
                "nodes": ["node_trigger","node_send","node_result"],
                "edges": ["edge_trigger_to_send","edge_send_to_result"],
                "data": ["data_customer_phone"],
                "credentials": [],
                "flow": {
                  "order": [
                    {"nodeId": "node_trigger", "edgeId": "edge_trigger_to_send"},
                    {"nodeId": "node_send", "edgeId": "edge_send_to_result"},
                    {"nodeId": "node_result"}
                  ]
                }
              }
            }
          }
  widget:
    enabled: false
    type: dynamic_widget
    params: []

  testing:
    handles_files: false
    produces_files: false
